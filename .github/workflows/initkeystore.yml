name: Init Debug Keystore (one-shot)

on:
  workflow_dispatch:

jobs:
  make-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print SHA-1 / SHA-256 (copie-les dans Firebase)
        run: |
          keytool -list -v -alias androiddebugkey \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android

      - name: Export keystore as base64 (to save as GH Secret)
        run: base64 ~/.android/debug.keystore > debug.keystore.b64

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: |
            ~/.android/debug.keystore
            debug.keystore.b64
