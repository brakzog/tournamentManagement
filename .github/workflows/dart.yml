name: Flutter CI

on:
  push:
    branches: [ "feature/v1.0" ]
  pull_request:
    branches: [ "feature/v1.0" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3  # Remplacez par la version de Flutter que vous utilisez

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3  # Remplacez par votre version

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS}}" >> android/key.properties


      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB (Play Store)
        run: flutter build appbundle --release

      - name: Upload APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest  # Xcode obligatoire pour iOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3  # Remplace avec ta version

       # Décoder le certificat .p12 et le sauvegarder temporairement
      - name: Decode iOS certificate and verify content
        run: |
          echo "Decoding iOS certificate..."
          echo "$IOS_CERTIFICATE" | base64 --decode > /tmp/ios_certificate.p12
          echo "Verifying .p12 file content..."
          ls -l /tmp/ios_certificate.p12  # Vérification de la taille et des permissions
          cat /tmp/ios_certificate.p12  # Affiche le contenu pour débogage (attention, il peut être illisible)

      - name: Create and unlock keychain
        run: |
          if security list-keychains | grep -q "ios-build.keychain"; then
            echo "Keychain ios-build.keychain already exists. Skipping creation."
          else
            echo "Creating keychain..."
            security create-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          fi
          
          echo "Unlocking keychain..."
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain

      - name: Import certificate into keychain
        run: |
          echo "Importing certificate into keychain..."
          security import /tmp/ios_certificate.p12 -k ios-build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A

      - name: Verify certificate import
        run: |
          echo "Verifying certificate import..."
          security find-identity -v -p codesigning
          

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod update Firebase/CoreOnly AppAuth GoogleSignIn
          pod install --repo-update
      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Build iOS (Flutter)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS App
        run: |
          mkdir -p build/ios
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath ../build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: build/ios/Runner.xcarchive
