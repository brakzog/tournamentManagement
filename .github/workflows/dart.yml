name: Flutter CI

on:
  push:
    branches: [ "feature/v1.0" ]
  pull_request:
    branches: [ "feature/v1.0" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3  # Remplacez par la version de Flutter que vous utilisez

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3  # Remplacez par votre version

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS}}" >> android/key.properties


      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB (Play Store)
        run: flutter build appbundle --release

      - name: Upload APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest  # Xcode obligatoire pour iOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3  # Remplace avec ta version

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod update Firebase/CoreOnly AppAuth GoogleSignIn
          pod install --repo-update
      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: gem install fastlane
     
      - name: Setup Git Credentials
        run: git config --global url."https://${{ secrets.GIT_AUTH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Set environment variables for Fastlane
        run: |
         echo "FASTLANE_USER=${{ secrets.FASTLANE_USER }}"
          echo "FASTLANE_PASSWORD=${{ secrets.FASTLANE_PASSWORD }}"
          echo "MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}"

          echo "FASTLANE_USER=${{ secrets.FASTLANE_USER }}" >> $GITHUB_ENV
          echo "FASTLANE_PASSWORD=${{ secrets.FASTLANE_PASSWORD }}" >> $GITHUB_ENV
          echo "MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}" >> $GITHUB_ENV

      - name: Check if Fastlane secrets are set
        run: |
          if [ -z "${{ secrets.FASTLANE_USER }}" ]; then 
            echo "❌ FASTLANE_USER is NOT set!";
          else 
            echo "✅ FASTLANE_USER is set!";
          fi
    
          if [ -z "${{ secrets.FASTLANE_PASSWORD }}" ]; then 
            echo "❌ FASTLANE_PASSWORD is NOT set!";
          else 
            echo "✅ FASTLANE_PASSWORD is set!";
          fi

      - name: Debug Fastlane Env
        run: env | grep FASTLANE

      - name: Check password format
        run: |
          echo "Password length: ${#FASTLANE_PASSWORD}"

      - name: Fix password format (if needed)
        run: |
          export FIXED_PASSWORD=$(echo "${FASTLANE_PASSWORD}" | tr -d '-')
          echo  "Fixed password length: ${#FIXED_PASSWORD}"

      




      - name: Run Fastlane Match
        run: fastlane match appstore --git_url "https://github.com/brakzog/ios_certif.git"

      - name: Build and sign IPA with Fastlane
        run: fastlane beta  # Utiliser bundle exec pour éviter les conflits
